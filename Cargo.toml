[workspace]
resolver = "3"
members = ["crates/*"]
# (Extensions build for WebAssembly on their own: extensions/build.sh.)
exclude = ["extensions"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/benwbooth/turbine"

[workspace.dependencies]
turbine-text = { path = "crates/turbine-text" }
turbine-ui = { path = "crates/turbine-ui" }
turbine-tui = { path = "crates/turbine-tui" }
turbine-vi = { path = "crates/turbine-vi" }
turbine-term = { path = "crates/turbine-term" }
turbine-syntax = { path = "crates/turbine-syntax" }
turbine-services = { path = "crates/turbine-services" }
ropey = "1.6"
encoding_rs = "0.8"
chardetng = "0.1"
unicode-width = "0.2"
unicode-segmentation = "1.12"
unicode-bidi = "0.3"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package]
name = "turbine-syntax"
description = "Syntax highlighting for Turbine: tree-sitter with built-in grammars plus Helix's, loaded on demand, run off the UI thread"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tree-sitter = "0.27.2"
tree-sitter-language = "0.1.9"
streaming-iterator = "0.1.9"
libloading = "0.9.1"
ureq = { version = "3", features = ["json"] }
serde_json.workspace = true
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-css = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-html = "0.23.2"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-lua = "0.5.0"
tree-sitter-md = "0.5.4"
tree-sitter-python = "0.25.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24.2"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-yaml = "0.7.2"
tree-sitter-sequel = "0.3.13"
# tessh's grammar lives in Tessera; scripts/sync-tessh-grammar.sh copies it here.
tree-sitter-tessh = { path = "../../vendor/tree-sitter-tessh" }

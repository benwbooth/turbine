[package]
name = "turbine"
description = "A retro DOS-style, AI-first code editor and IDE"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
libc = "0.2"
turbine-text.workspace = true
turbine-ui.workspace = true
turbine-tui.workspace = true
serde.workspace = true
serde_json.workspace = true
regex = "1.13.1"
turbine-vi.workspace = true
crossterm.workspace = true
turbine-term.workspace = true
turbine-syntax.workspace = true
turbine-ext.workspace = true
turbine-services.workspace = true
pulldown-cmark = { version = "0.13", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }
similar = "2"
toml = { version = "1.2.3", features = ["preserve_order"] }
yaml-rust2 = "0.13.2"
roxmltree = "0.21.2"
